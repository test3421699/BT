name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Prepare Environment and Compile
      run: |
        PROJECT_ROOT=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_ROOT" ]; then
          echo "Could not find settings.gradle, defaulting to root directory."
          PROJECT_ROOT="."
        fi
        
        echo "Navigating into project folder: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # Prepare .env from .env.example if .env does not exist
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          echo "Creating .env from .env.example..."
          cp .env.example .env
        fi
        
        # Restore or create debug.keystore required by debug signingConfig
        if [ ! -f "debug.keystore" ]; then
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi
        
        # Build APK using Gradle
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RC
        path: "**/build/outputs/apk/debug/*.apk"
